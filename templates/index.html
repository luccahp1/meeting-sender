<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeting Sender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0f1a;
      --surface:  #151828;
      --border:   #232640;
      --accent:   #4f6ef7;
      --accent2:  #7c8ff8;
      --success:  #22c55e;
      --error:    #ef4444;
      --warn:     #f59e0b;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --radius:   14px;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .header .icon {
      font-size: 2.8rem;
      display: block;
      margin-bottom: .6rem;
    }
    .header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -.02em;
      background: linear-gradient(135deg, #a5b4fc, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p {
      color: var(--muted);
      font-size: .9rem;
      margin-top: .35rem;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 8px 40px rgba(0,0,0,.45);
    }

    /* ── Drop zone ── */
    #drop-zone {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 3rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      position: relative;
    }
    #drop-zone:hover, #drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(79,110,247,.06);
    }
    #drop-zone.has-file {
      border-color: var(--success);
      background: rgba(34,197,94,.05);
    }
    #drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .drop-icon { font-size: 2.4rem; margin-bottom: .6rem; }
    .drop-title { font-size: 1rem; font-weight: 600; color: var(--text); }
    .drop-sub   { font-size: .82rem; color: var(--muted); margin-top: .3rem; }

    /* ── File info ── */
    #file-info {
      display: none;
      align-items: center;
      gap: .75rem;
      background: rgba(79,110,247,.1);
      border: 1px solid rgba(79,110,247,.25);
      border-radius: 8px;
      padding: .75rem 1rem;
      margin-top: 1rem;
      font-size: .88rem;
    }
    #file-info.visible { display: flex; }
    #file-info .fi-icon { font-size: 1.4rem; }
    #file-info .fi-name { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #file-info .fi-size { color: var(--muted); font-size: .78rem; }
    #file-info .fi-clear {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 1.1rem; padding: 0 .2rem; transition: color .15s;
    }
    #file-info .fi-clear:hover { color: var(--error); }

    /* ── Button ── */
    .btn-send {
      width: 100%;
      margin-top: 1.25rem;
      padding: .85rem;
      border: none;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), #6366f1);
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
    }
    .btn-send:hover:not(:disabled)  { opacity: .9; }
    .btn-send:active:not(:disabled) { transform: scale(.98); }
    .btn-send:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Status banner ── */
    #status {
      display: none;
      align-items: center;
      gap: .6rem;
      margin-top: 1rem;
      padding: .75rem 1rem;
      border-radius: 8px;
      font-size: .88rem;
      font-weight: 500;
    }
    #status.visible { display: flex; }
    #status.sending  { background: rgba(79,110,247,.12); color: var(--accent2); border: 1px solid rgba(79,110,247,.2); }
    #status.success  { background: rgba(34,197,94,.1);   color: var(--success); border: 1px solid rgba(34,197,94,.2); }
    #status.error    { background: rgba(239,68,68,.1);   color: var(--error);   border: 1px solid rgba(239,68,68,.2); }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid currentColor; border-top-color: transparent;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    .footer {
      margin-top: 1.5rem;
      font-size: .78rem;
      color: var(--muted);
      text-align: center;
    }
    .footer span { opacity: .6; }
    .receiver-url {
      font-family: monospace;
      color: var(--accent2);
      opacity: .85;
    }
  </style>
</head>
<body>

  <div class="header">
    <span class="icon">🎙️</span>
    <h1>Meeting Sender</h1>
    <p>Drop a .vtt transcript and send it for analysis</p>
  </div>

  <div class="card">
    <!-- Drop zone -->
    <div id="drop-zone">
      <input type="file" id="file-input" accept=".vtt" />
      <div class="drop-icon">📂</div>
      <div class="drop-title">Drag &amp; drop your .vtt file here</div>
      <div class="drop-sub">or click to browse</div>
    </div>

    <!-- File info row -->
    <div id="file-info">
      <span class="fi-icon">📄</span>
      <span class="fi-name" id="fi-name">—</span>
      <span class="fi-size" id="fi-size">—</span>
      <button class="fi-clear" id="fi-clear" title="Remove">✕</button>
    </div>

    <!-- Send button -->
    <button class="btn-send" id="btn-send" disabled>Send for Analysis</button>

    <!-- Status -->
    <div id="status"></div>
  </div>

  <div class="footer">
    Sending to <span class="receiver-url">{{ receiver_url }}</span>
  </div>

  <script>
    const dropZone  = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const fileInfo  = document.getElementById('file-info');
    const fiName    = document.getElementById('fi-name');
    const fiSize    = document.getElementById('fi-size');
    const fiClear   = document.getElementById('fi-clear');
    const btnSend   = document.getElementById('btn-send');
    const statusEl  = document.getElementById('status');

    let selectedFile = null;

    function formatBytes(b) {
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
      return (b/1048576).toFixed(1) + ' MB';
    }

    function setFile(file) {
      if (!file) return;
      if (!file.name.toLowerCase().endsWith('.vtt')) {
        showStatus('error', '✕ Only .vtt files are supported');
        return;
      }
      selectedFile = file;
      fiName.textContent  = file.name;
      fiSize.textContent  = formatBytes(file.size);
      fileInfo.classList.add('visible');
      dropZone.classList.add('has-file');
      btnSend.disabled = false;
      clearStatus();
    }

    function clearFile() {
      selectedFile = null;
      fileInput.value = '';
      fileInfo.classList.remove('visible');
      dropZone.classList.remove('has-file');
      btnSend.disabled = true;
      clearStatus();
    }

    function showStatus(type, msg, spinner = false) {
      statusEl.className = 'visible ' + type;
      statusEl.innerHTML = (spinner ? '<div class="spinner"></div>' : '') + `<span>${msg}</span>`;
    }
    function clearStatus() {
      statusEl.className = '';
      statusEl.innerHTML = '';
    }

    // Drag & drop
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', ()  => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const f = e.dataTransfer.files[0];
      if (f) setFile(f);
    });
    fileInput.addEventListener('change', () => { if (fileInput.files[0]) setFile(fileInput.files[0]); });
    fiClear.addEventListener('click', e => { e.stopPropagation(); clearFile(); });

    // Send
    btnSend.addEventListener('click', async () => {
      if (!selectedFile) return;

      btnSend.disabled = true;
      showStatus('sending', 'Sending transcript…', true);

      const fd = new FormData();
      fd.append('file', selectedFile, selectedFile.name);

      try {
        const res  = await fetch('/send', { method: 'POST', body: fd });
        const data = await res.json();

        if (res.ok) {
          showStatus('success', `✓ Queued! Check your dashboard for results. (job: ${data.id?.slice(0,8) ?? 'ok'})`);
          clearFile();
        } else {
          showStatus('error', '✕ ' + (data.error || 'Unknown error'));
          btnSend.disabled = false;
        }
      } catch (err) {
        showStatus('error', '✕ Network error — is the receiver running?');
        btnSend.disabled = false;
      }
    });
  </script>
</body>
</html>
